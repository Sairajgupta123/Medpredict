name: Frontend checks

on:
  push:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Start production server
        run: |
          npm run start -- --hostname 0.0.0.0 > /tmp/medipredict-next.log 2>&1 &
          echo $! > /tmp/medipredict-next.pid
      - name: Wait for production server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/medipredict-next.log
          exit 1
      - name: Production API smoke tests
        run: npm run smoke-test
      - name: Stop production server
        if: always()
        run: if [ -f /tmp/medipredict-next.pid ]; then kill $(cat /tmp/medipredict-next.pid) || true; fi
