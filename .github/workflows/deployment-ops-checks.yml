name: Deployment operations checks

on:
  push:
    branches: [develop, main]
    paths:
      - "deployment/**"
      - ".github/workflows/deployment-ops-checks.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "deployment/**"
      - ".github/workflows/deployment-ops-checks.yml"

permissions:
  contents: read

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate PostgreSQL operations scripts
        run: |
          bash -n deployment/postgres-backup.sh
          bash -n deployment/postgres-restore.sh
          bash deployment/tests/test-postgres-operations.sh
          bash -n deployment/run-worker.sh
          bash deployment/tests/test-worker-wrapper.sh
