name: Backend tests

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medipredict
          POSTGRES_PASSWORD: medipredict_ci_password
          POSTGRES_DB: medipredict_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medipredict -d medipredict_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply initial migration to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://medipredict:medipredict_ci_password@localhost:5432/medipredict_ci
        run: |
          alembic upgrade head
          alembic current

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://medipredict:medipredict_ci_password@localhost:5432/medipredict_ci
        run: pytest
