name: Machine learning tests

on:
  push:
    branches: [develop, main]
    paths:
      - "ml/**"
      - ".github/workflows/ml-tests.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "ml/**"
      - ".github/workflows/ml-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install lightweight ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements.txt

      - name: Run ML, dataset and preprocessing tests
        run: python -m pytest ml -q
